name: Update research news

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify selection and archive behavior
        run: node --test scripts/update-news.test.mjs
      - name: Fetch today's research edition
        run: node scripts/update-news.mjs
      - name: Commit daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news
          if git diff --cached --quiet; then
            echo "The daily archive is already up to date."
            exit 0
          fi
          git commit -m "Update daily computational immunology news"
          git pull --rebase origin main
          git push origin HEAD:main
