name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build website, Update research news]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Enable Settings > Pages > GitHub Actions and set repository variable
    # DEPLOY_PAGES=true when you want to publish the website.
    if: vars.DEPLOY_PAGES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --test scripts/update-news.test.mjs
      - run: npm run build
        env:
          VITE_BASE_PATH: /personal-website/
      - name: Support direct room and terminal links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
