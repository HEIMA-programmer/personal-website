<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yanbin's travel map</title>
    <link rel="stylesheet" href="./leaflet.css" />
    <link rel="stylesheet" href="./map.css" />
    <script src="./leaflet.js" defer></script>
    <script src="./map.js" defer></script>
  </head>
  <body>
    <div id="map" aria-label="Interactive world map"></div>
    <button id="satellite-toggle" class="map-button" type="button" aria-pressed="false">Satellite</button>
    <div class="map-status" role="status">
      <strong>Travel map</strong>
      <span id="travel-status">Loading travel locations…</span>
    </div>
    <div id="map-error" class="map-error" role="status" hidden>
      Map tiles are unavailable. Check your connection or try the other map view.
    </div>
    <noscript>This interactive map requires JavaScript.</noscript>
  </body>
</html>
